<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="wand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="shuttle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>

  <!-- Court Outline -->
  <rect x="80" y="80" width="352" height="352" rx="24" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="8"/>
  <line x1="80" y1="256" x2="432" y2="256" stroke="rgba(56, 189, 248, 0.4)" stroke-width="6" stroke-dasharray="8 8"/>
  <line x1="256" y1="80" x2="256" y2="432" stroke="rgba(56, 189, 248, 0.2)" stroke-width="6"/>

  <!-- Magic Wand & Shuttlecock / Ball Motif -->
  <!-- Shuttlecock skirt -->
  <path d="M210 200 L180 310 L256 300 L332 310 L302 200 Z" fill="none" stroke="url(#shuttle)" stroke-width="12" stroke-linejoin="round"/>
  <line x1="218" y1="250" x2="294" y2="250" stroke="url(#shuttle)" stroke-width="8"/>
  <!-- Shuttlecock cork -->
  <circle cx="256" cy="180" r="30" fill="url(#shuttle)"/>

  <!-- Magic Sparkles -->
  <path d="M370 140 Q370 170 400 170 Q370 170 370 200 Q370 170 340 170 Q370 170 370 140 Z" fill="url(#wand)"/>
  <path d="M140 130 Q140 150 160 150 Q140 150 140 170 Q140 150 120 150 Q140 150 140 130 Z" fill="url(#wand)"/>
  <path d="M370 330 Q370 345 385 345 Q370 345 370 360 Q370 345 355 345 Q370 345 370 330 Z" fill="url(#wand)"/>
</svg>